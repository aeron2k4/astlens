version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR for all compatible updates; major versions come one by one.
    groups:
      cargo:
        update-types: [minor, patch]
  # Actions are pinned by commit, with the version in a comment.
  - package-ecosystem: github-actions
    directory: /
    # Its versions are branches, which Dependabot does not tell apart: it moved
    # the MSRV job's `# 1.90` pin to the commit of `stable`.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
