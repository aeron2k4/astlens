name: Audit

# Advisories appear without any commit here, so this also runs on a schedule.
on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, .github/workflows/audit.yml]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
