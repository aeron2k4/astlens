name: Release

# Push a tag matching the version in Cargo.toml, e.g. `git tag -a v0.1.0 -m
# "astlens 0.1.0" && git push origin v0.1.0`. To release a tag that
# already exists, run this workflow by hand with that tag. The tag must be on
# main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the history of main, for the check below
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

  # Linux decides the release: once its tests and build pass, the release goes
  # out without waiting for the Windows runner.
  linux:
    needs: check
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more distros
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked
      - run: scripts/test-guard.sh
      - run: cargo build --release --locked

      # Ship the bare executable, named by OS and without the version, so
      # releases/latest/download/astlens-<os> is a stable URL.
      - run: cp target/release/astlens astlens-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: astlens-linux
          if-no-files-found: error

  release:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux
          path: dist
      # One checksum file for all binaries: `sha256sum -c SHA256SUMS`.
      - name: Checksums
        run: cd dist && sha256sum astlens-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "astlens $TAG" \
            --generate-notes \
            --verify-tag

  # Added to the published release when it finishes. A failure here leaves the
  # release without the Windows binary.
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked
      - run: cp target/release/astlens.exe astlens-windows.exe
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: astlens-windows.exe
          if-no-files-found: error

  # Separate from the build, so that the write token never meets the build's
  # third-party actions and build scripts.
  windows-publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows
      - name: Add binary and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset=astlens-windows.exe
          gh release upload "$TAG" "$asset" --clobber

          gh release download "$TAG" --pattern SHA256SUMS --clobber
          grep -v "  $asset\$" SHA256SUMS > sums.new || true
          echo "$(sha256sum "$asset" | cut -d' ' -f1)  $asset" >> sums.new
          mv sums.new SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
