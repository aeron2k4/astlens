name: Release

# Push a tag matching the version in Cargo.toml, e.g. `git tag -a v0.2.0 -m
# "code-scope-mcp 0.2.0" && git push origin v0.2.0`. To release a tag that
# already exists, run this workflow by hand with that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    needs: check
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 links against an older glibc, so the binaries run on more distros.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Intel macOS is cross-compiled on the Apple Silicon runner.
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name=code-scope-mcp-$TAG-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/code-scope-mcp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "code-scope-mcp-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/code-scope-mcp.exe, README.md, LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            code-scope-mcp-*.tar.gz
            code-scope-mcp-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # One checksum file for all archives: `sha256sum -c SHA256SUMS`.
      - name: Checksums
        run: cd dist && sha256sum code-scope-mcp-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "code-scope-mcp $TAG" \
            --generate-notes \
            --verify-tag
