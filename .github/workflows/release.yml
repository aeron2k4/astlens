name: Release

# Push a tag matching the version in Cargo.toml, e.g. `git tag -a v0.2.0 -m
# "code-scope-mcp 0.2.0" && git push origin v0.2.0`. To release a tag that
# already exists, run this workflow by hand with that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

  # Linux decides the release: once its tests and build pass, the release goes
  # out without waiting for macOS and Windows runners, which can queue for long.
  linux:
    needs: check
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more distros
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: scripts/test-guard.sh
      - run: cargo build --release --locked

      # Ship the bare executable, named by OS and without the version, so
      # releases/latest/download/code-scope-mcp-<os> is a stable URL.
      - run: cp target/release/code-scope-mcp code-scope-mcp-linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: code-scope-mcp-linux
          if-no-files-found: error

  release:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      # One checksum file for all binaries: `sha256sum -c SHA256SUMS`.
      - name: Checksums
        run: cd dist && sha256sum code-scope-mcp-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "code-scope-mcp $TAG" \
            --generate-notes \
            --verify-tag

  # Each OS adds its binary to the published release when it finishes. A failure
  # here leaves the release without that binary.
  other:
    needs: release
    name: add binary (${{ matrix.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, name: macos }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, name: windows }
    runs-on: ${{ matrix.os }}
    steps:
      # The token is only for the last step, not for the build.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Add binary and checksum to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          asset="code-scope-mcp-${{ matrix.name }}$ext"
          cp "target/${{ matrix.target }}/release/code-scope-mcp$ext" "$asset"
          gh release upload "$TAG" "$asset" --clobber

          if command -v sha256sum >/dev/null; then hash=$(sha256sum "$asset" | cut -d' ' -f1)
          else hash=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          fi
          line="$hash  $asset"

          # Both OSes rewrite SHA256SUMS and may finish together, overwriting
          # each other: repeat until our line is really in the published file.
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh release download "$TAG" --pattern SHA256SUMS --clobber; then
              if grep -Fxq "$line" SHA256SUMS; then exit 0; fi
              grep -v "  $asset\$" SHA256SUMS > sums.new || true
              echo "$line" >> sums.new
              mv sums.new SHA256SUMS
              gh release upload "$TAG" SHA256SUMS --clobber || true
            fi
            sleep $((RANDOM % 15 + 5))
          done
          echo "::error::could not add $asset to SHA256SUMS"
          exit 1
