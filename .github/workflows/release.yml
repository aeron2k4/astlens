name: Release

# Push a tag matching the version in Cargo.toml, e.g. `git tag -a v0.2.0 -m
# "astlens 0.2.0" && git push origin v0.2.0`. To release a tag that
# already exists, run this workflow by hand with that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

  # Linux decides the release: once its tests and build pass, the release goes
  # out without waiting for the Windows runner.
  linux:
    needs: check
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more distros
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: scripts/test-guard.sh
      - run: cargo build --release --locked

      # Ship the bare executable, named by OS and without the version, so
      # releases/latest/download/astlens-<os> is a stable URL.
      - run: cp target/release/astlens astlens-linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: astlens-linux
          if-no-files-found: error

  release:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      # One checksum file for all binaries: `sha256sum -c SHA256SUMS`.
      - name: Checksums
        run: cd dist && sha256sum astlens-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "astlens $TAG" \
            --generate-notes \
            --verify-tag

  # Added to the published release when it finishes. A failure here leaves the
  # release without the Windows binary.
  windows:
    needs: release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      # The token is only for the last step, not for the build.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Add binary and checksum to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset=astlens-windows.exe
          cp target/release/astlens.exe "$asset"
          gh release upload "$TAG" "$asset" --clobber

          gh release download "$TAG" --pattern SHA256SUMS --clobber
          grep -v "  $asset\$" SHA256SUMS > sums.new || true
          echo "$(sha256sum "$asset" | cut -d' ' -f1)  $asset" >> sums.new
          mv sums.new SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
