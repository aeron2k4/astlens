name: Release

# Push a tag matching the version in Cargo.toml, e.g. `git tag -a v0.2.0 -m
# "code-scope-mcp 0.2.0" && git push origin v0.2.0`. To release a tag that
# already exists, run this workflow by hand with that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    needs: check
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 links against an older glibc, so the binaries run on more distros.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, name: linux }
          - { target: aarch64-apple-darwin, os: macos-latest, name: macos }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, name: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # Ship the bare executable, named by OS and without the version, so
      # releases/latest/download/code-scope-mcp-<os> is a stable URL.
      - name: Name binary
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          cp "target/${{ matrix.target }}/release/code-scope-mcp$ext" \
            "code-scope-mcp-${{ matrix.name }}$ext"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: code-scope-mcp-${{ matrix.name }}*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # One checksum file for all binaries: `sha256sum -c SHA256SUMS`.
      - name: Checksums
        run: cd dist && sha256sum code-scope-mcp-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "code-scope-mcp $TAG" \
            --generate-notes \
            --verify-tag
